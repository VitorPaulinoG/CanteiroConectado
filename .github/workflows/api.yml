name: API

on:
  push:
    branches: [main]
    paths: ['apps/api/**', '.github/workflows/api.yml']
  pull_request:
    branches: [main]
    paths: ['apps/api/**', '.github/workflows/api.yml']

jobs:
  coverage: 
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      
      - run: ./mvnw -B verify


