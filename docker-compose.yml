services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: canteiroconectado
      POSTGRES_USER: ${BANCO_USUARIO}
      POSTGRES_PASSWORD: ${BANCO_SENHA}
    ports:
      - "5432:5432"
    volumes:
      - db-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    build: ./apps/api
    env_file: .env
    environment:
      BANCO_URL: jdbc:postgresql://db:5432/canteiroconectado
    ports:
      - "8080:${PORT:-8080}"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped

  # Seed de desenvolvimento (apps/api/seed/seed.sql). Fica fora do `docker compose up` por estar no
  # profile "seed"; roda sob demanda com: docker compose --profile seed run --rm seed
  # Exige que a API já tenha subido ao menos uma vez (migrations do Flyway aplicadas).
  seed:
    image: postgres:16
    profiles: ["seed"]
    environment:
      PGHOST: db
      PGDATABASE: canteiroconectado
      PGUSER: ${BANCO_USUARIO}
      PGPASSWORD: ${BANCO_SENHA}
    volumes:
      - ./apps/api/seed:/seed:ro
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/seed/seed.sql"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  db-dados:
